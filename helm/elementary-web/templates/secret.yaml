{{/*
secret.yaml — Kubernetes Secret for all sensitive environment variables.

Values are base64-encoded at render time from values.yaml (or --set overrides).
NEVER commit a values-prod.yaml containing real credentials to git.

Included keys:
  DATABASE_URL      — full PostgreSQL connection string for the Next.js app
  POSTGRES_PASSWORD — PostgreSQL superuser/app password
  POSTGRES_USER     — PostgreSQL username
  POSTGRES_DB       — PostgreSQL database name
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "elementary-web.secretName" . }}
  labels:
    {{- include "elementary-web.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:5432/%s" .Values.postgres.user .Values.postgres.password (include "elementary-web.postgresServiceName" .) .Values.postgres.db | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | b64enc | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | b64enc | quote }}
  POSTGRES_DB: {{ .Values.postgres.db | b64enc | quote }}
